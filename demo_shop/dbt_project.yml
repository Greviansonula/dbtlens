name: demo_shop
version: "1.0.0"
config-version: 2
profile: demo_shop

model-paths: ["models"]


models:
  demo_shop:          
    staging:          
      +materialized: view # `table` stores the results, makes reads faster but means the data is only as new as the last run
      +schema: staging
    marts:
      +materialized: table
      +schema: marts