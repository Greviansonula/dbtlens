version: 2

models:
  - name: fct_payments
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: amount_paid
        data_tests: [not_null]

  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: fct_daily_revenue
    columns:
      - name: revenue_date
        data_tests: [unique, not_null]

exposures:
  - name: revenue_dashboard
    type: dashboard
    maturity: high
    owner: {name: Finance Analytics, email: finance@example.com}
    depends_on:
      - ref('fct_daily_revenue')
  - name: customer_ltv_report
    type: analysis
    owner: {name: Growth Team, email: growth@example.com}
    depends_on:
      - ref('dim_customers')