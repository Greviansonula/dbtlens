version: 2

sources:
  - name: shop
    schema: raw
    config:
      loaded_at_field: _loaded_at          # when a row arrived
      freshness:
        warn_after:  {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: customers
        columns:
          - name: id
            data_tests: [not_null]
      - name: orders
        columns:
          - name: id
            data_tests: [not_null]
      - name: payments
        columns:
          - name: id
            data_tests: [not_null]